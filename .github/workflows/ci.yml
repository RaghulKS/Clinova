name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLINOVA_MODE: demo
      UV_PYTHON: '3.11'
      PYTEST_ADDOPTS: --junitxml=test-results.xml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore

  demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLINOVA_MODE: demo
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Build and start demo stack
        timeout-minutes: 6
        run: docker compose up --build --detach --wait --wait-timeout 120 api app
      - name: Complete seeded demo run
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://localhost:8000"
          with urllib.request.urlopen(base + "/health", timeout=10) as response:
              health = json.load(response)
          assert health["mode"] == "demo" and health["db"], health
          request = urllib.request.Request(
              base + "/runs",
              data=json.dumps({"nct_id": "NCT03232892"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              assert response.status == 202, response.status
              created = json.load(response)
          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              with urllib.request.urlopen(base + created["status_url"], timeout=10) as response:
                  status = json.load(response)
              assert status["stage"] != "failed", status
              if status["stage"] == "done":
                  assert status["source"] in ("live", "cache"), status  # cache: frozen v1.0 risk/flags/fixes
                  result = status["result"]
                  assert result["protocol"]["trial_id"] == "NCT03232892", result
                  assert result["funnel"] and result["sim"], result
                  assert len(result["risks"]) == 3 and len(result["fixes"]) == 3, result
                  print("Seeded demo run completed with no fixture fallback.")
                  break
              time.sleep(1)
          else:
              raise TimeoutError("Demo run did not finish within 90 seconds.")
          PY
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Drive the demo trial through the app in a browser
        timeout-minutes: 4
        env:
          UV_PYTHON: '3.11'
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium
          uv run python -c "import json, sys; sys.path.insert(0, 'scripts'); import clean_path; print(json.dumps(clean_path.browser_flow()))"
      - name: Diagnose a failed demo run
        if: failure()
        timeout-minutes: 2
        run: |
          docker compose exec -T api python - <<'PY' || true
          import logging
          logging.basicConfig(level=logging.INFO)
          from clinova.api.runs import RUNS
          from clinova.api.schemas import RunRequest
          st = RUNS.get(RUNS.submit(RunRequest(nct_id="NCT03232892"), background=False))
          print(st.stage, st.source, st.message)
          PY
      - name: Demo stack logs and cleanup
        if: always()
        timeout-minutes: 1
        run: |
          docker compose logs --no-color --tail=100 || true
          docker compose down --volumes --remove-orphans
