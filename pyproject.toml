[project]
name = "clinova"
version = "0.1.0"
description = "Test-fly an NSCLC trial protocol on virtual patients before enrolling real ones."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "optuna>=3.6",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.36",
    "plotly>=5.22",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "respx>=0.21",
    "playwright>=1.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clinova"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".data", ".worktrees", ".claude", "mirofish", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
