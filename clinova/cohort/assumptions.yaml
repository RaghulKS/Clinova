# Clinova NSCLC clinical trait distributions (DRAFT from spike T03).
# Target population: US adults with advanced or metastatic NSCLC who are candidates for systemic therapy.
# Rules for every entry:
#   source:      list of URLs (see docs/spikes/clinical_distributions.md for the full citation and caveats)
#   assumption:  true  = no published number found for this exact quantity; value proposed with `reasoning`
#                false = value is taken or directly computed from the cited source(s)
#   evidence:    primary = numbers read from the paper itself; excerpt = numbers seen only in a search excerpt or abstract
#                (re-verify before quoting); none = pure assumption
#   confidence:  high | medium | low  (how well the number represents the target population)
# Probabilities in a `probs` map sum to 1.0 (checked by a one-off script, see handoff).
# Never tune any value here on the test split (AGENTS.md honesty rule).

meta:
  version: 0.1-draft
  population: "US advanced/metastatic NSCLC, systemic-therapy candidates"
  anchor_cohorts:
    flatiron_pdl1_2l: {n: 5256, desc: "Flatiron EHR, advanced NSCLC treated with PD-(L)1 before 2017-07-01 (mostly 2L+)", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6899461"}
    flatiron_1l_io: {n: 7312, desc: "Flatiron EHR, stage III-IV NSCLC starting 1L immunotherapy from 2016-01-01 to 2020-06-30 (chemo-IO n=4271, IO mono n=3041)", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8209237"}
    lcmc1: {n: 733, desc: "Lung Cancer Mutation Consortium 1, stage IV lung adenocarcinoma, 10-gene testing 2009-2012, 14 US sites", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC4163053"}
    bidmc_genotype: {n: 381, desc: "Beth Israel Deaconess, all-stage NSCLC tumor-patient pairs, 73.8% stage IV", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3800098"}

demographics:
  age:
    type: categorical_bands          # sample band, then uniform within band
    bands:                           # [low, high) in years
      - {range: [18, 50], p: 0.030}
      - {range: [50, 65], p: 0.301}
      - {range: [65, 75], p: 0.367}
      - {range: [75, 91], p: 0.302}
    median_check: 69                 # Flatiron nivolumab/pembrolizumab cohort, IQR 61-75
    assumption: false
    evidence: primary
    confidence: medium
    note: "Bands computed from Table 2 of the Flatiron PD-(L)1 cohort (160/1584/1930/1582 of 5256). Upper edge 91 and lower edge 18 are assumptions. Never-smoker/driver-positive patients are younger (ALK+ Flatiron median 63) and are under-represented here because they receive TKIs instead of PD-(L)1."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6899461
      - https://resources.flatiron.com/publications/characteristics-of-real-world-metastatic-non-small-cell-lung-cancer-patients-treated-with-nivolumab-and-pembrolizumab-during-the-year-following-approval
      - https://seer.cancer.gov/statfacts/html/lungb.html   # all-stage lung median age 71; 65-74 = 36.4%, 75-84 = 28.4%, >84 = 9.0% (context only)

  sex:
    type: categorical
    probs: {male: 0.536, female: 0.464}
    assumption: false
    evidence: primary
    confidence: medium
    note: "2819 of 5256 male in Flatiron PD-(L)1 cohort. Other cohorts: 56% male (Flatiron nivo/pembro first year), 51% (BIDMC pembrolizumab), 52.7% (Flatiron pembrolizumab TPS>=50), SEER age-adjusted incidence 52.0 vs 43.6 per 100k male vs female."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6899461
      - https://seer.cancer.gov/statfacts/html/lungb.html

  race:
    type: categorical
    probs: {white: 0.773, black: 0.093, asian: 0.027, other_or_multiple: 0.107}
    assumption: false
    evidence: primary
    confidence: medium
    note: "Among 4766 patients with recorded race in the Flatiron PD-(L)1 cohort (3685/445/131/505; other rounded up from 10.6% so probabilities sum to 1). Flatiron skews community-oncology and likely under-counts Asian patients vs academic centers (BIDMC cohort: 75.9% White, 13.1% Asian, 6.5% Black). Race is self-reported or EHR-recorded, not genetic ancestry."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6899461
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC3800098

  hispanic_ethnicity:
    type: bernoulli
    p: 0.06
    assumption: true
    evidence: none
    confidence: low
    reasoning: "No advanced-NSCLC Hispanic share found. SEER age-adjusted incidence is about half of non-Hispanic White (29.8 vs 57.0 per 100k male; 23.2 vs 50.9 female). Hispanics are about 19% of the US population but younger, so their share of cases is below 19*0.5/(19*0.5+81)=10.5%. Proposed 6% after allowing for the younger age structure. Sample it independently of race and treat it as an overlap flag."
    source:
      - https://seer.cancer.gov/statfacts/html/lungb.html

  smoking_status:
    type: categorical
    probs: {never: 0.15, former_or_current: 0.85}
    assumption: true
    evidence: primary_for_anchors
    confidence: low
    reasoning: "Anchors disagree by design. Immunotherapy-treated community cohorts: never-smokers 7.4% (Flatiron pembrolizumab TPS>=50), 10.6% (Flatiron PD-(L)1, 553/5232 with no history) but biased low because EGFR/ALK-positive never-smokers get TKIs instead. Genotyped academic or adenocarcinoma cohorts: 27.8% (BIDMC), 34% (LCMC1) biased high. Proposed 15%, inside the range, shifted toward the broader community population."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6899461
      - https://www.frontiersin.org/journals/oncology/articles/10.3389/fonc.2022.834761/full
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC3800098
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC4163053

disease:
  stage_at_initial_diagnosis:       # for patients who are now advanced/metastatic (includes recurrences of earlier stages)
    type: categorical
    probs: {"0_I": 0.076, "II": 0.066, "III": 0.238, "IV": 0.620}
    assumption: false
    evidence: primary
    confidence: medium
    note: "Flatiron PD-(L)1 cohort, n=5099 with known stage (386/338/1216/3159). SEER all-stage lung for context: distant 51%, regional 21%, localized 24%, unknown 4%."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6899461
      - https://seer.cancer.gov/statfacts/html/lungb.html

  current_stage_at_screening:
    type: categorical
    probs: {IIIB_C_unresectable: 0.10, IV: 0.90}
    assumption: true
    evidence: none
    confidence: low
    reasoning: "Trials in scope are advanced or metastatic. Stage IV at diagnosis is 62% and many recurrences are metastatic, so stage IV at screening should dominate. 10% unresectable stage IIIB/C chosen as a round placeholder. No published number found."
    source: []

  histology:
    type: categorical
    probs: {nonsquamous: 0.70, squamous: 0.30}
    assumption: false
    evidence: primary
    confidence: medium
    note: "Nonsquamous 69.6% (3510/5045) in Flatiron PD-(L)1 cohort; 69.6% nonsquamous also close to 65% (Flatiron nivo/pembro first year), 70.3% (BIDMC pembrolizumab), 71.6% (Flatiron pembrolizumab TPS>=50, NSCLC NOS 4.9% reported separately). Nonsquamous = adenocarcinoma + large cell + NOS. Split adenocarcinoma/other is not needed by the simulator; use nonsquamous only."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6899461
      - https://resources.flatiron.com/publications/characteristics-of-real-world-metastatic-non-small-cell-lung-cancer-patients-treated-with-nivolumab-and-pembrolizumab-during-the-year-following-approval
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC7879233/

performance_status:
  ecog:
    type: categorical
    probs: {"0": 0.20, "1": 0.45, "2": 0.27, "3_plus": 0.08}
    assumption: true
    evidence: mixed
    confidence: low
    reasoning: "No single US source gives a clean 0/1/2/3+ split among systemic-therapy candidates: Flatiron ECOG is missing in about a quarter of patients (ALK+ cohort: 61% ECOG 0-1, 13.3% ECOG 2-4, 26% undocumented). Published ECOG>=2 shares: 34-48% of advanced NSCLC (review cited in ESMO Open PS2 consensus), 'up to 30-40%' in practice, 29.2% Alberta ICI cohort, 21.0% mean (range 6.0-48.6) in a real-world immunotherapy meta-analysis, 16% of chemo-IO patients (Waterhouse), 39.2% in the BIDMC pembrolizumab cohort (PS0 8.1%, PS1 52.7%, PS2 33.8%, PS3 5.4%, n=74), and 20.5/43.2/28.4/8.0% for PS 0/1/2/3 in a Seville pembrolizumab TPS>=50 cohort (n=88). ECOG>=2 proposed at 35% (the low end of the review range, since systemic-therapy candidates exclude most ECOG 4). Within-group ratios (0:1 = 20:45, 2:3+ = 27:8) follow the Seville cohort and keep the ordering 1 > 2 > 0 > 3+ seen in both small single-center cohorts. Both cohorts are tiny and non-representative, hence assumption: true, low confidence."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC8689080
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC7879233/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC11327465
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC8472602

  ecog_given_age_band:
    type: conditional_table
    given: age_band                 # same bands as demographics.age
    method: "logistic in age (OR 1.5 per decade for ECOG>=2), intercept solved so the age-weighted marginal ECOG>=2 equals 0.35; ECOG 0:1 ratio 20:45 and 2:3+ ratio 27:8 held constant across bands"
    table:
      "18_50":  {"0": 0.256, "1": 0.575, "2": 0.130, "3_plus": 0.039}
      "50_65":  {"0": 0.231, "1": 0.520, "2": 0.192, "3_plus": 0.057}
      "65_75":  {"0": 0.197, "1": 0.443, "2": 0.278, "3_plus": 0.082}
      "75_91":  {"0": 0.167, "1": 0.376, "2": 0.353, "3_plus": 0.104}
    assumption: true
    evidence: direction_only
    confidence: low
    reasoning: "Direction is published: BIDMC pembrolizumab cohort median age 65 (ECOG 0-1) vs 72 (ECOG>=2); Korean tertiary cohort ECOG 2-4 is 22.8% in patients 80+ vs a much lower share overall. Magnitude is an assumption: the BIDMC gap of 7 years would imply roughly OR 1.8 per decade (n=74, noisy); 1.5 chosen conservatively."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC7879233/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12541874   # Korean cohort, non-US, direction only

biomarkers:
  # Sampling order: histology -> smoking -> race -> driver. Drivers are mutually exclusive in practice
  # (BIDMC: "almost all had mutually exclusive results"; LCMC1: 3% had 2+ drivers). Draw one categorical per patient.
  egfr_sensitizing:
    type: conditional_bernoulli
    given: [histology, smoking_status]
    table:
      nonsquamous: {never: 0.46, former_or_current: 0.05}
      squamous:    {never: 0.034, former_or_current: 0.034}
    assumption: false               # nonsquamous cells: primary data from BIDMC (n=50 never, 129 ever); squamous: see note
    evidence: primary
    confidence: low
    note: "Nonsquamous cells are BIDMC EGFR frequency among 179 samples tested for EGFR, ALK and KRAS (never smokers 46%, ever smokers 5%). Cross-check: LCMC1 stage IV adenocarcinoma overall EGFR sensitizing 17% (122/733) with 34% never-smokers: 0.34*0.46+0.66*0.05=19%. Squamous: 3.4% (3/87 confirmed squamous) from one small series; same value used for both smoking cells because no smoking-split US figure was found (a separate series reports 26.2% vs 11.5% never vs ever in squamous, excerpt only, non-US, likely biased by misclassified adenosquamous). Treat squamous as assumption."
    race_adjustment:
      rule: "multiply odds of EGFR by or_asian when race == asian; cap resulting probability at 0.65"
      or_asian: 5.5
      cap: 0.65
      assumption: false
      note: "OR from AACR GENIE 8.0 (any EGFR alteration: 61.75% Asian vs 22.56% White => OR 5.5); BIDMC gives 62% vs 18.4% (OR 7.2). Never-smoker Asian women: 63% EGFR in a 198-patient Korean series, 75.3% in a 202-patient Shanghai series; cap 0.65 reflects that. Black patients: GENIE 33.67%, BIDMC 18.2% (n=22): no adjustment proposed, flagged as unresolved."
      source:
        - https://frontiersin.org/journals/oncology/articles/10.3389/fonc.2022.946625/full
        - https://pmc.ncbi.nlm.nih.gov/articles/PMC3800098
        - https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4467161/
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC3800098
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC4163053
      - https://doi.org/10.3892/or.2011.1182

  alk_rearrangement:
    type: conditional_bernoulli
    given: [histology, smoking_status]
    table:
      nonsquamous: {never: 0.14, former_or_current: 0.02}
      squamous:    {never: 0.005, former_or_current: 0.002}
    assumption: false               # nonsquamous cells primary; squamous cells are assumptions (see note)
    evidence: primary
    confidence: low
    note: "Nonsquamous: BIDMC ALK FISH, never smokers 14%, ever smokers 2%. Cross-check: LCMC1 8% (57/733) overall, GENIE 3.15% White / 5.08% Asian / 2.81% Black. With 15% never-smokers the table yields about 3.8% in nonsquamous, in line with the 3-5% commonly quoted and below LCMC1 (an adenocarcinoma, 34% never-smoker cohort). Squamous cells: no source found for ALK in squamous tumors; 0.5% and 0.2% are assumptions (assumption: true for those two cells) reflecting that ALK fusions are very rare outside adenocarcinoma."
    race_adjustment:
      rule: "none for Asian; Hispanic ethnicity multiplies ALK odds by 2.0 (assumption)"
      assumption: true
      note: "GENIE ALK is 5.08% Asian vs 3.15% White (OR 1.6, small). A 2025 Los Angeles series (excerpt only) reports 12.76% Hispanic vs 5.36% non-Hispanic ALK, odds ratio about 2.6. Latin American meta-analysis ALK 5% (55 studies). Proposed 2.0 as a conservative midpoint; low confidence."
      source:
        - https://frontiersin.org/journals/oncology/articles/10.3389/fonc.2022.946625/full
        - https://perfilesycapacidades.javeriana.edu.co/en/publications/prevalence-of-oncogenic-driver-mutations-in-hispanicslatin-patien/
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC3800098
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC4163053

  ros1_rearrangement:
    type: conditional_bernoulli
    given: [histology, smoking_status]
    table:
      nonsquamous: {never: 0.035, former_or_current: 0.010}
      squamous:    {never: 0.002, former_or_current: 0.001}
    assumption: true
    evidence: mixed
    confidence: low
    reasoning: "US unselected frequency is 1.7% (18/1073, MGH, all NSCLC, all ROS1 tumors adenocarcinoma, patients younger and more often never-smokers). GENIE: 1.32% White, 3.56% Asian, 2.5% Black. Never-smoker rate 3.4% (7/208) is from a Korean series (non-US). Ever-smoker 1.0% back-solved so a cohort with about 28% never-smokers gives 1.7%: 0.28*0.035+0.72*0.010=1.7%. Squamous cells are assumptions: ROS1 has been described essentially only in adenocarcinoma (Bergethon 2012: all positive tumors adenocarcinomas)."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC3295572
      - https://ir.ymlib.yonsei.ac.kr/handle/22282913/87472
      - https://frontiersin.org/journals/oncology/articles/10.3389/fonc.2022.946625/full

  pdl1_tps_band:
    type: categorical
    probs: {"lt1": 0.33, "1_49": 0.37, "ge50": 0.30}
    applies_to: "patients without EGFR/ALK/ROS1 driver, tested for PD-L1"
    assumption: true
    evidence: mixed
    confidence: medium
    reasoning: "Published splits (lt1 / 1-49 / ge50): 31/42/27 (multinational 1L chemo-IO nonsquamous, n=430; JCO Glob Oncol 2024, excerpt only); 25/30/44 (single center n=1208, selected for monotherapy, Cancers 2022, excerpt only); 48/30/22 (China n=879, J Cancer 2021, excerpt only); 38.7/37.0/24.3 computed from Flatiron 1L chemo-IO patients with a PD-L1 result (squamous + nonsquamous; biased low in ge50 because TPS>=50% patients often receive monotherapy). Reck (KEYNOTE-024 lead) states high PD-L1 is about 27-30% of advanced NSCLC (OncLive, secondary). Proposed 33/37/30. About 20% of Flatiron 1L chemo-IO patients have no PD-L1 result (nonsquamous 747/3457 = 21.6%); handle untested as a separate flag in the simulator, not in this table."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC8209237
      - https://www.analysisgroup.com/Insights/publishing/real-world-outcomes-of-first-line-treatment-with-anti-pdl1-based-combination-therapy-for-nonsquamous-metastatic-non-small-cell-lung-cancer-a-multiregional-chart-review-in-europe-japan-and-the-united-states/
      - https://jcancer.org/v12p7390
      - https://onclive.com/view/frontline-pembrolizumab-practicechanging-for-advanced-nsclc
    correlations:
      egfr_alk_ros1_positive: "PD-L1 testing and high TPS are less relevant in these patients; Chinese cohort reports TPS>=1% in about 50% of EGFR/ALK-negative patients. No quantified US conditional table found; sample PD-L1 only for driver-negative patients."

brain_metastases:
  any_brain_mets_given_histology:
    type: conditional_bernoulli
    given: [histology]
    table: {nonsquamous: 0.14, squamous: 0.05}
    assumption: false
    evidence: primary
    confidence: medium
    note: "Brain metastases recorded in Flatiron 1L immunotherapy patients: nonsquamous 468/3457 = 13.5% (chemo-IO), 317/2166 = 14.6% (IO mono); squamous 42/814 = 5.2% and 42/875 = 4.8%. This is brain metastases on record at 1L start (any time before), so it understates lifetime incidence. Higher figures: NCDB stage IV at presentation 26% (all histologies); structured review about 20% at diagnosis rising to 40% over the disease course; BIDMC pembrolizumab 33.8%. NCDB histology gradient (all stages): adenocarcinoma 12.99% vs squamous 4.89%, OR 2.93."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC8209237
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6990432
  age_effect:
    type: odds_ratio
    or_per_10_years: 0.70
    assumption: false
    evidence: primary
    confidence: medium
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6990432
  status_given_any_brain_mets:
    type: categorical
    probs: {treated_and_stable: 0.60, untreated: 0.40}
    assumption: true
    evidence: none
    confidence: low
    reasoning: "No source found for the treated-vs-untreated split of NSCLC patients who have brain metastases at trial screening. Trial protocols commonly allow treated, stable (off steroids) lesions and often exclude untreated or symptomatic ones, so this split drives eligibility. 60/40 is a placeholder; run the simulator with 40/60 and 80/20 as a sensitivity check."
    source: []

prior_therapy:
  reaches_line_2_given_started_1l:
    type: bernoulli
    p: 0.516
    assumption: false
    evidence: primary
    confidence: medium
    note: "ConcertAI/UMN real-world EHR, advanced NSCLC (IIIB-IV) 2015-2021, n=8,811: 51.6% received a second line, 26.4% a third line; 78.7% community practices."
    source:
      - https://www.concertai.com/publications/real-world-treatment-patterns-among-advanced-non-small-cell-lung-cancer-patients-in-the-us
      - https://doi.org/10.24926/iip.v16i3.6702
  reaches_line_3_given_started_1l:
    type: bernoulli
    p: 0.264
    assumption: false
    evidence: primary
    confidence: medium
    source:
      - https://www.concertai.com/publications/real-world-treatment-patterns-among-advanced-non-small-cell-lung-cancer-patients-in-the-us
  prior_lines_at_screening_for_untargeted_pool:
    type: categorical
    probs: {"0": 0.562, "1": 0.290, "2_plus": 0.148}
    assumption: true
    evidence: derived
    confidence: low
    reasoning: "Derived, not published. If each patient who starts line k is an equally likely screening candidate, line starts per 100 patients are 100 (L1), 51.6 (L2), 26.4 (L3+, counted once): shares 100/178, 51.6/178, 26.4/178 = 56.2/29.0/14.8%. Undercounts lines 4+. Which row applies depends on the trial: the simulator should instead condition on the trial's required line of therapy and use this only for trials that do not restrict it."
    source:
      - https://www.concertai.com/publications/real-world-treatment-patterns-among-advanced-non-small-cell-lung-cancer-patients-in-the-us
  prior_targeted_therapy_in_pdl1_cohort:
    type: reference_value
    value: 0.054
    assumption: false
    evidence: primary
    note: "EGFR TKI as prior therapy in 283/5256 (5.4%) of Flatiron patients starting PD-(L)1; 'no prior therapy' 25.3% (1329/5256). Use for the share of previously targeted patients among driver-positive patients."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6899461
  prior_perioperative_or_chemoradiation_systemic:
    type: bernoulli
    p: 0.25
    assumption: true
    evidence: none
    confidence: low
    reasoning: "No published share found. 14.2% of Flatiron PD-(L)1 patients were stage 0-II and 23.8% stage III at initial diagnosis (38% candidates for curative-intent therapy); not all received systemic or consolidation therapy. 25% placeholder; sets 'prior systemic therapy in the (neo)adjuvant or chemoradiation setting' separately from metastatic lines."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6899461

organ_function:
  weight_kg_for_cockcroft_gault:
    type: lognormal_by_sex_age
    sigma_log: 0.24
    mean_kg:                         # NHANES 2015-2018 US adult means; 50_64 uses 50-59/60-69 midpoint
      male:   {"18_50": 93.9, "50_65": 91.5, "65_75": 89.4, "75_91": 80.5}
      female: {"18_50": 80.8, "50_65": 78.4, "65_75": 76.4, "75_91": 67.9}
    assumption: false
    evidence: primary
    confidence: medium
    note: "General-population means (Table 3 and Table 5 of NCHS Series 3 No. 46: female 60-69 mean 78.2 / 70-79 74.7 / 80+ 67.9; male 60-69 91.2 / 70-79 87.7 / 80+ 80.5; female 40-49 80.8 / 50-59 78.7; male 40-49 93.9 / 50-59 91.9). sigma_log 0.24 derived from the 5th, 50th and 95th percentiles (female 60-69: 50.8 / 75.1 / 112.7). Patients with advanced lung cancer weigh less on average than the general population (weight loss is common); provide a knob `weight_multiplier` default 1.0, to be set below 1.0 only if a published NSCLC weight is found."
    weight_multiplier: 1.0
    source:
      - https://www.cdc.gov/nchs/data/series/sr_03/sr03-046-508.pdf
  serum_creatinine_mg_dl:
    type: lognormal_by_sex
    median: {male: 0.95, female: 0.75}
    sigma_log: 0.25
    floor: 0.4
    assumption: true
    evidence: none
    confidence: low
    reasoning: "No NSCLC serum creatinine distribution retrieved. Medians approximate typical adult reference values; sigma_log 0.25 chosen so the implied CrCl<60 share lands near published estimates (below). Floor of 0.4 prevents implausible CrCl from very low creatinine (many sites round up to 0.7-0.8 in Cockcroft-Gault; set `scr_floor` to 0.7 to emulate)."
    source: []
  creatinine_clearance_formula:
    type: formula
    expression: "crcl_ml_min = (140 - age) * weight_kg / (72 * scr_mg_dl) * (0.85 if female else 1.0)"
    assumption: false
    evidence: primary
    source:
      - https://doi.org/10.1159/000180580   # Cockcroft DW, Gault MH. Nephron 1976;16:31-41
  crcl_sanity_check:
    type: reference_values
    implied_by_model_with_flatiron_age_bands: {crcl_lt_30: 0.007, crcl_lt_45: 0.07, crcl_lt_60: 0.21, crcl_lt_90: 0.565, median_ml_min: 84}
    published_comparators:
      pan_cancer_cockcroft_gault_n1217_turkey: {ge90: 0.729, "60_89": 0.198, "30_59": 0.062, "15_29": 0.006}
      flatiron_pdl1_renal_function_label: {normal: 0.972, moderate_failure: 0.024, severe_failure: 0.005}
    assumption: false
    evidence: excerpt
    note: "Model output is from a one-off simulation (seed 1, 100k draws) using the age bands, sex split and NHANES weights above with sigma_log 0.25. The pan-cancer comparator is a younger mixed-tumor population and is therefore lower. The Flatiron label definitions were not stated in the paper text retrieved, so 2.4% moderate failure is not comparable to CrCl<60 and likely uses a stricter threshold. Re-check calibration if the cohort sampler changes."
    source:
      - https://link.springer.com/article/10.1007/BF02850082
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6899461

labs_baseline_abnormality:
  # Probability that a patient FAILS the common eligibility threshold at screening (treatment-naive or first-line).
  # No NSCLC baseline lab distribution was found for these thresholds: all values are assumptions, low confidence.
  # `anchors` give what was found. Thresholds are the ones repeated across NSCLC protocols (e.g. NCT02574078).
  thresholds_seen_in_protocols:
    anc_ge_1_5e9_L: true
    platelets_ge_100e9_L: true
    hemoglobin_ge_9_g_dL: true
    ast_alt_le_2_5x_uln: "5x with liver metastases (NCT03739710); 3x in NCT02574078"
    bilirubin_le_1_5x_uln: true
    crcl_ge_40_or_30: "40 mL/min (or creatinine <=1.5x ULN) in NCT02574078; >=30 mL/min in NCT03739710"
    source:
      - https://cdn.clinicaltrials.gov/large-docs/78/NCT02574078/Prot_000.pdf
      - https://cdn.clinicaltrials.gov/large-docs/10/NCT03739710/Prot_SAP_001.pdf
  p_fail:
    hemoglobin_lt_9:   {first_line: 0.05, later_line: 0.10}
    platelets_lt_100:  {first_line: 0.02, later_line: 0.05}
    anc_lt_1_5:        {first_line: 0.03, later_line: 0.06}
    ast_or_alt_gt_2_5x_uln: {first_line: 0.04, later_line: 0.05}
    bilirubin_gt_1_5x_uln:  {first_line: 0.02, later_line: 0.03}
    assumption: true
    evidence: none
    confidence: low
    reasoning: "Anchors: (1) ECAS across all tumor types: Hb<10 g/dL in 10% of patients at enrollment and Hb<12 in 39% (lung cancer anemia is described as common at baseline but a lung-specific percentage was not retrieved); Hb<9 set to 5%, half the pan-cancer Hb<10 rate, then doubled for later lines after platinum. (2) Flatiron PD-(L)1 cohort: moderate or severe hepatic failure label in only 1.3% (50 of 3875 with data), so liver failure is rare; AST/ALT>2.5x ULN set to 4% to include liver metastases. (3) Trial Pathfinder: a lymphocyte count >500/uL exclusion removes 6.3% of Flatiron aNSCLC patients on average, an actual measured example showing single laboratory criteria exclude single-digit percentages. (4) ISPOR 2026 review excerpt reports organ dysfunction 26% among trial-ineligible real-world ICI patients (definition varies). Platelets, ANC and bilirubin values are plain assumptions. Marrow involvement is rare; most cytopenias follow chemotherapy, hence later_line > first_line. Lab abnormalities are positively correlated with ECOG>=2 and liver metastases (qualitative; not quantified), so sample jointly through a latent 'frailty' variable if the simulator supports it."
    source:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC9007176
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6899461
      - https://doi.org/10.2147/CMAR.S45236
      - https://pubmed.ncbi.nlm.nih.gov/17409943/
      - https://www.ispor.org/heor-resources/presentations-database/presentation-cti/ispor-europe-2026/poster-session-2-5/trial-ineligible-patients-receiving-immune-checkpoint-inhibitors-for-advanced-nsclc-a-systematic-review-of-real-world-evidence

correlations:
  - {pair: [ecog, age], direction: positive, size: "assumption OR 1.5 per decade for ECOG>=2", assumption: true, source: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC7879233/"]}
  - {pair: [egfr, smoking_never], direction: positive, size: "46% never vs 5% ever (BIDMC, nonsquamous)", assumption: false, source: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC3800098"]}
  - {pair: [egfr, asian_race], direction: positive, size: "OR about 5.5 (GENIE), 7.2 (BIDMC)", assumption: false, source: ["https://frontiersin.org/journals/oncology/articles/10.3389/fonc.2022.946625/full", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3800098"]}
  - {pair: [egfr, sex_female], direction: positive, size: "enrichment reported; no US percentage retrieved, not modelled separately (partly mediated by smoking)", assumption: true, source: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC3800098"]}
  - {pair: [alk_ros1, age], direction: negative, size: "ALK+ Flatiron median age 63 vs 69 overall; ROS1+ significantly younger (Bergethon)", assumption: false, source: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC11327465", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3295572"]}
  - {pair: [kras_not_modelled, smoking_ever], direction: positive, size: "6% never vs 43% ever (BIDMC); KRAS is not a Clinova trait, listed so driver-negative patients are not double-counted", assumption: false, source: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC3800098"]}
  - {pair: [crcl, age], direction: negative, size: "mechanical via (140 - age) in Cockcroft-Gault, plus weight falls after 70 (female 80+ mean 67.9 kg vs 78.4 kg at 50-64)", assumption: false, source: ["https://doi.org/10.1159/000180580", "https://www.cdc.gov/nchs/data/series/sr_03/sr03-046-508.pdf"]}
  - {pair: [brain_mets, histology_nonsquamous], direction: positive, size: "OR 2.93 adenocarcinoma vs squamous (NCDB); 14% vs 5% (Flatiron 1L IO)", assumption: false, source: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6990432", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8209237"]}
  - {pair: [brain_mets, age], direction: negative, size: "OR 0.70 per 10 years", assumption: false, source: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6990432"]}
  - {pair: [pdl1_ge50, driver_positive], direction: negative, size: "not quantified from retrieved US sources", assumption: true, source: []}

eligibility_sanity_check:
  # Share of real advanced NSCLC patients who meet typical trial eligibility. Use as a plausibility band for the screen output,
  # not as a calibration target to tune on.
  restrictive_phase3_modern:
    fraction_eligible: 0.30
    range_across_10_trials: "mean 30% (1553 of 5167 on average)"
    assumption: false
    evidence: primary
    confidence: medium
    note: "Trial Pathfinder (Liu et al., Nature 2021): average across 10 phase-III aNSCLC trials emulated in Flatiron (61,094 aNSCLC patients); only 30% of Flatiron patients who took the trial drugs met all encodable original criteria. Data-driven relaxation (about 9 rules removed) raised the eligible pool from 1,553 to 3,209 on average (+107%, about 62% of the 5,167 fully relaxed pool). The paper's introduction states around 80% of aNSCLC patients did not meet the criteria of the analysed trials (a different denominator: all aNSCLC patients)."
    source:
      - https://doi.org/10.1038/s41586-021-03430-5
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC9007176
  academic_single_center_first_line:
    fraction_eligible: 0.644
    by_therapy: {chemotherapy: 0.721, immunotherapy: 0.400, targeted: 0.588}
    n: 163
    assumption: false
    evidence: excerpt
    confidence: low
    source:
      - https://www.cancernetwork.com/view/clinical-trial-eligibility-and-outcomes-in-patients-with-metastatic-nsclc-treated-outside-of-clinical-trials
  broad_range_literature:
    fraction_ineligible_786_pt_review: 0.60          # 469 of 786; brain mets 41% and ECOG 3-4 25% leading reasons (excerpt only)
    fraction_eligible_range_cited: [0.27, 0.45]       # "earlier cited estimate", excerpt only
    german_crisp_registry_n7774: {top_reason_ecog_ge2_among_ineligible: 0.609, brain_mets_at_inclusion_among_ineligible: 0.493}
    assumption: false
    evidence: excerpt
    confidence: low
    note: "Figures read from search-result excerpts only; full texts were 403 or paywalled. Re-verify before quoting externally."
    source:
      - https://www.sciencedirect.com/science/article/abs/pii/S1525730418301347
      - https://doi.org/10.3747/co.25.3978
      - https://www.jtocrr.org/article/S2666-3643(23)00169-8/fulltext
  recommended_band_for_simulator_output: {low: 0.25, central: 0.30, high: 0.65}
  recommended_band_is_assumption: true
  recommended_band_reasoning: "Low end from the 27-45% literature range rounded down, central from Trial Pathfinder, high from the single-center academic series (64.4%) for permissive protocols. Screen output far outside 0.15-0.80 for a typical phase 3 protocol should be treated as a bug."

# T13 implementation priors: these fill fields absent from the published spike.
# Empty sources explicitly mean unsupported simulation assumptions, never measured data.
implementation_priors:
  stage_subtype:
    probs: {IIIB: 0.5, IIIC: 0.5, IVA: 0.5, IVB: 0.5}
    assumption: true
    source: []
    reasoning: "Equal split within the advanced stage groups; no substage table retrieved."
  nonsquamous_label:
    value: adenocarcinoma
    assumption: true
    source: []
    reasoning: "Represent the undivided nonsquamous group with adenocarcinoma; subtype-specific rules are approximate."
  smoking_ever_split:
    former_fraction: 0.75
    assumption: true
    source: []
  driver_age:
    alk_ros1_odds_ratio_per_decade: 0.85
    reference_age: 69
    assumption: true
    source: [https://pmc.ncbi.nlm.nih.gov/articles/PMC11327465, https://pmc.ncbi.nlm.nih.gov/articles/PMC3295572]
    reasoning: "Published direction only; effect size is a conservative simulation prior."
  pdl1_driver_positive:
    high_probability_multiplier: 0.5
    assumption: true
    source: []
    reasoning: "Contract requires a numeric TPS for every persona. Use the same untested prior, reducing the high band; no measured US conditional table."
  prior_therapy:
    platinum_given_prior_line: 0.90
    immunotherapy_given_prior_line: 0.65
    max_lines: 3
    assumption: true
    source: []
    reasoning: "Treatment history shares and split of the 2+ category are placeholders; therapy setting fixes current line."
  lab_values:
    normal_ranges: {anc: [1.5, 7.0], platelets: [100, 450], hemoglobin: [9, 16], liver: [0.3, 2.5], bilirubin: [0.3, 1.5]}
    abnormal_ranges: {anc: [0.5, 1.49], platelets: [30, 99], hemoglobin: [6, 8.99], liver: [2.51, 5], bilirubin: [1.51, 3]}
    frailty_multiplier: 2.0
    shared_liver_failure: true
    assumption: true
    source: []
    reasoning: "Uniform values on each side of sourced thresholds; ECOG>=2 doubles lab abnormality risk before normalization. AST/ALT share an abnormality indicator."
  additional_conditions:
    leptomeningeal: 0.01
    measurable_disease: 0.95
    autoimmune_disease: 0.05
    interstitial_lung_disease: 0.03
    active_infection: 0.02
    cardiac_condition: 0.06
    consent_capacity: 0.99
    pregnancy_given_female_under50: 0.005
    assumption: true
    source: []
  life_expectancy_months:
    median_by_ecog: [18, 12, 8, 4, 2]
    sigma_log: 0.5
    assumption: true
    source: []
    reasoning: "Unvalidated simulation prior; not a prognosis for an individual patient."
