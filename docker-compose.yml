# Placeholder local stack (owner: T00 until T31, which adds api, app, seed loading and profiles).
# timescale/timescaledb-ha bundles pgvector; this tag matches the Tiger Cloud service
# (PostgreSQL 18.6, TimescaleDB 2.30.2). Then: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/clinova make db-apply
services:
  db:
    image: timescale/timescaledb-ha:pg18.6-ts2.30.2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinova
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinova"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
